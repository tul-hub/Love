<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>I Love You Heart 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@600&display=swap" rel="stylesheet">
<style>
:root{--bg1:#fff6f8;--bg2:#ffd3de;--l:40%;--ui:#5e0f2c;--field:rgba(255,255,255,.75);--line:rgba(94,15,44,.25);--btn:#d90f4c;--btn-ink:#fff;--focus:#ff1457;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#3a0d20;--bg2:#0e030a;--l:70%;--ui:#ffd3df;--field:rgba(255,255,255,.08);--line:rgba(255,211,223,.28);--btn:#ff4d7d;--btn-ink:#2a0615;--focus:#fff}}
:root[data-theme="dark"]{--bg1:#3a0d20;--bg2:#0e030a;--l:70%;--ui:#ffd3df;--field:rgba(255,255,255,.08);--line:rgba(255,211,223,.28);--btn:#ff4d7d;--btn-ink:#2a0615;--focus:#fff}
html{scroll-padding-top:env(safe-area-inset-top,0px);min-height:100%}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:12px;box-sizing:border-box;font-family:Quicksand,system-ui,sans-serif;color:var(--ui);background:var(--bg2);background:radial-gradient(circle at 50% 40%,var(--bg1),var(--bg2) 78%);overflow-x:hidden}
.stage{width:min(100%,66vh,600px);aspect-ratio:1;position:relative}
.stage canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
.stage canvas:active{cursor:grabbing}
.cap{margin:0;font-size:26px;font-weight:600;text-align:center}
button{font:inherit;font-size:16px;color:var(--btn-ink);background:var(--btn);border:0;border-radius:999px;padding:11px 22px;cursor:pointer}
button:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.note{margin:0;font-size:14px;opacity:.8;text-align:center}
</style>
</head>
<body>
<div class="stage" id="stage" role="img" aria-label="A rotating 3D heart made of 100 repeating love messages for Sonia"></div>
<p class="cap">I Love You Sonia ❤️</p>
<button id="music" type="button" aria-pressed="false">♪ Play music</button>
<p class="note">Drag to turn the heart.</p>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const N=100,MSG='I Love You Sonia',stage=document.getElementById('stage');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
let renderer;
try{renderer=new THREE.WebGLRenderer({antialias:true,alpha:true})}catch(e){stage.textContent='3D graphics are not available in this browser.';throw e}
renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
stage.appendChild(renderer.domElement);
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(45,1,.1,50),group=new THREE.Group();
camera.position.set(0,0,4);scene.add(group);

// heart surface: implicit equation, rays from the centre, then 100 evenly spaced picks
const F=(x,y,z)=>{const a=x*x+2.25*z*z+y*y-1;return a*a*a-x*x*y*y*y-.1125*z*z*y*y*y};
function targets(){
  const c=[],n=3000;
  for(let i=0;i<n;i++){
    const dy=1-2*(i+.5)/n,r=Math.sqrt(1-dy*dy),a=i*2.39996,dx=Math.cos(a)*r,dz=Math.sin(a)*r;
    let lo=0,hi=2;
    for(let k=0;k<28;k++){const m=(lo+hi)/2;F(m*dx,m*dy,m*dz)<=0?lo=m:hi=m}
    c.push(new THREE.Vector3(lo*dx,lo*dy-.12,lo*dz));
  }
  const out=[c[0]],md=c.map(p=>p.distanceToSquared(c[0]));
  while(out.length<N){
    let bi=0;for(let i=1;i<c.length;i++)if(md[i]>md[bi])bi=i;
    const q=c[bi];out.push(q);
    for(let i=0;i<c.length;i++){const d=c[i].distanceToSquared(q);if(d<md[i])md[i]=d}
  }
  return out;
}
function radial(size,stops){
  const c=document.createElement('canvas');c.width=c.height=size;const g=c.getContext('2d');
  const gr=g.createRadialGradient(size/2,size/2,0,size/2,size/2,size/2);
  stops.forEach(s=>gr.addColorStop(s[0],s[1]));g.fillStyle=gr;g.fillRect(0,0,size,size);
  return new THREE.CanvasTexture(c);
}
function makeTex(msg){
  const c=document.createElement('canvas');c.width=768;c.height=128;
  const g=c.getContext('2d'),fam='Quicksand, system-ui, sans-serif';
  g.font='600 100px '+fam;
  const fs=Math.min(84,100*730/g.measureText(msg).width);
  g.font='600 '+fs+'px '+fam;g.textAlign='center';g.textBaseline='middle';
  g.fillStyle='#fff';g.shadowColor='#fff';g.shadowBlur=10;
  g.fillText(msg,384,66);g.fillText(msg,384,66);
  return new THREE.CanvasTexture(c);
}

// background glow + drifting sparkles
const glow=new THREE.Sprite(new THREE.SpriteMaterial({map:radial(128,[[0,'rgba(255,64,120,.6)'],[1,'rgba(255,64,120,0)']]),transparent:true,depthWrite:false}));
glow.scale.set(3.6,3.6,1);glow.position.z=-.6;glow.renderOrder=-1;scene.add(glow);
const NP=140,pa=new Float32Array(NP*3),ps=[];
for(let i=0;i<NP;i++){pa[i*3]=(Math.random()-.5)*5;pa[i*3+1]=(Math.random()-.5)*5;pa[i*3+2]=(Math.random()-.5)*3;ps.push(.1+Math.random()*.25)}
const pg=new THREE.BufferGeometry();pg.setAttribute('position',new THREE.BufferAttribute(pa,3));
scene.add(new THREE.Points(pg,new THREE.PointsMaterial({size:.09,color:0xff6f9c,map:radial(64,[[0,'rgba(255,255,255,1)'],[1,'rgba(255,255,255,0)']]),transparent:true,opacity:.8,depthWrite:false})));

let pts,sprites=[],tex,time=0,t0=0,L0=.7,PL=.95;
function theme(){const l=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--l'))/100||.7;L0=l;PL=l>.5?.95:.55}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',theme);
function build(){
  if(tex)tex.dispose();
  tex=makeTex(MSG);
  sprites.forEach(o=>{group.remove(o.sp);o.sp.material.dispose()});
  sprites=pts.map(p=>{
    const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true,depthWrite:false}));
    sp.scale.set(.66,.11,1);group.add(sp);
    const from=new THREE.Vector3(Math.random()-.5,Math.random()-.5,Math.random()-.5).normalize().multiplyScalar(3+Math.random()*3);
    return {sp,p,from,d:Math.random()*1.6,h:(330+(p.y+1.1)/2.3*25)/360,r:Math.hypot(p.x,p.y,p.z)/1.3};
  });
  t0=time;
}

let rotY=0,rotX=.12,velY=.35,drag=false,lx=0,ly=0;
const el=renderer.domElement,v=new THREE.Vector3(),yAxis=new THREE.Vector3(0,1,0),clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
el.addEventListener('pointerdown',e=>{drag=true;lx=e.clientX;ly=e.clientY;el.setPointerCapture(e.pointerId)});
el.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-lx;rotY+=dx*.01;rotX=clamp(rotX+(e.clientY-ly)*.008,-.9,.9);velY=clamp(dx*.4,-4,4);lx=e.clientX;ly=e.clientY});
['pointerup','pointercancel'].forEach(n=>el.addEventListener(n,()=>{drag=false}));
const bump=(x,c,w)=>Math.exp(-(((x-c)/w)**2));
function size(){const w=stage.clientWidth;renderer.setSize(w,w)}
new ResizeObserver(size).observe(stage);size();

let last=performance.now();
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min((now-last)/1000,.05);last=now;time+=dt;
  const t=time-t0;
  if(!drag){velY+=((reduce?0:.35)-velY)*Math.min(1,dt*1.5);rotY+=velY*dt;rotX+=(.12+.1*Math.sin(time*.5)-rotX)*Math.min(1,dt*2)}
  const live=!reduce&&t>3.2,ph=live?((t-3.2)%2.8)/2.8:-1;
  const s=live?1+.07*bump(ph,.1,.05)+.045*bump(ph,.28,.05):1;
  group.rotation.set(rotX,rotY,0);group.scale.setScalar(s);group.updateMatrixWorld();
  glow.material.opacity=.45+(s-1)*3;
  for(const o of sprites){
    const k=reduce?1:clamp((t-o.d)/1.5,0,1),e=1-Math.pow(1-k,3);
    o.sp.position.copy(o.p).multiplyScalar(e).addScaledVector(o.from,1-e).applyAxisAngle(yAxis,(1-e)*2.5);
    const front=clamp((v.copy(o.sp.position).applyMatrix4(group.matrixWorld).z+1.2)/2.4,0,1);
    const w=live?bump(ph,.08+o.r*.3,.07):0,sc=(.4+.6*e)*(1+.25*w);
    o.sp.scale.set(.66*sc,.11*sc,1);
    o.sp.material.opacity=k*(.28+.72*front);
    o.sp.material.color.setHSL(o.h,.85+.15*w,L0+(PL-L0)*w);
  }
  for(let i=0;i<NP;i++){pa[i*3+1]+=ps[i]*dt;if(pa[i*3+1]>2.5)pa[i*3+1]=-2.5}
  pg.attributes.position.needsUpdate=true;
  renderer.render(scene,camera);
}
// original romantic music-box tune, synthesised live with Web Audio (no audio files needed)
const MB=document.getElementById('music'),STEP=60/68/2,ARP=[0,1,2,3,2,3,2,1],mf=m=>440*Math.pow(2,(m-69)/12);
const CH=[[48,[55,60,64,67]],[52,[55,59,62,64]],[53,[57,60,64,65]],[43,[55,60,64,67]],[45,[57,60,64,67]],[50,[57,60,62,65]],[53,[57,60,64,65]],[43,[55,59,62,67]]];
const BARS=[[[0,76,4],[4,79,2],[6,76,2]],[[0,74,3],[3,76,1],[4,79,4]],[[0,81,4],[4,79,2],[6,77,2]],[[0,76,6],[6,74,2]],[[0,72,2],[2,76,2],[4,81,4]],[[0,79,3],[3,77,1],[4,74,4]],[[0,77,2],[2,81,2],[4,84,4]],[[0,83,4],[4,79,4]]];
let ac,bus,mg,nextT=0,step=0,tm=null,on=false;
function setupAudio(){
  ac=new (window.AudioContext||window.webkitAudioContext)();
  mg=ac.createGain();mg.gain.value=.8;mg.connect(ac.destination);
  bus=ac.createGain();bus.connect(mg);
  const len=ac.sampleRate*2.5,buf=ac.createBuffer(2,len,ac.sampleRate);
  for(let c=0;c<2;c++){const d=buf.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.5)}
  const cv=ac.createConvolver(),wet=ac.createGain();cv.buffer=buf;wet.gain.value=.4;
  bus.connect(cv);cv.connect(wet);wet.connect(mg);
}
function tone(m,t,d,type,vol,att){
  const o=ac.createOscillator(),g=ac.createGain();
  o.type=type;o.frequency.value=mf(m);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+att);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g);g.connect(bus);o.start(t);o.stop(t+d+.05);
}
function play(s,t){
  const bar=s>>3,e=s&7,c=CH[bar],m=c[1][ARP[e]];
  tone(m,t,1.5,'triangle',.1,.01);tone(m+12,t,.6,'sine',.025,.005);
  if(e===0||e===4)tone(c[0],t,2.2,'sine',.17,.02);
  if(e===0)c[1].forEach(n=>tone(n,t,8*STEP+.6,'sine',.03,.9));
  BARS[bar].forEach(([o,n,d])=>{if(o===e){tone(n,t,d*STEP+.5,'sine',.12,.03);tone(n,t,d*STEP+.3,'triangle',.04,.03)}});
}
function pump(){while(nextT<ac.currentTime+.6){play(step%64,nextT);nextT+=STEP;step++}}
MB.onclick=()=>{
  on=!on;MB.setAttribute('aria-pressed',on);MB.textContent=on?'♪ Pause music':'♪ Play music';
  if(on){
    if(!ac)setupAudio();
    ac.resume();mg.gain.cancelScheduledValues(0);mg.gain.setTargetAtTime(.8,ac.currentTime,.05);
    step=0;nextT=ac.currentTime+.1;clearInterval(tm);tm=setInterval(pump,150);
  }else{clearInterval(tm);mg.gain.setTargetAtTime(0,ac.currentTime,.15)}
};
document.addEventListener('visibilitychange',()=>{if(ac&&on)document.hidden?ac.suspend():ac.resume()});

function init(){pts=targets();theme();build();requestAnimationFrame(frame)}
(document.fonts?document.fonts.load('600 20px Quicksand'):Promise.resolve()).then(init,init);
</script>
</body>
</html>
